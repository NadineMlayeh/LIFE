<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="LIFE">
  <!--
    A keyhole in gilt on walnut.

    The whole application is a room you let yourself into, and a keyhole is the one shape that
    says so without a word of explanation. It also survives being sixteen pixels wide, which
    rules out most of the alternatives: a bookshelf, a longcase clock or a window all collapse
    into a smudge at that size, while a circle above a tapering slot stays legible.
  -->
  <defs>
    <linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E4B0"/>
      <stop offset="0.45" stop-color="#D8B463"/>
      <stop offset="1" stop-color="#9C7A32"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#6B4A24"/>
      <stop offset="1" stop-color="#20150E"/>
    </radialGradient>
  </defs>

  <!-- The panel: dark wood, so the gilt reads as metal rather than as yellow. -->
  <rect width="32" height="32" rx="7" fill="url(#lamp)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.4" fill="none"
        stroke="#A8863C" stroke-opacity="0.55" stroke-width="1.1"/>

  <!--
    The keyhole, drawn as one shape so it stays solid when it is scaled down, and enlarged
    about the centre of the panel: at sixteen pixels a timid mark disappears into a crowded
    tab strip, and the margin it gives back buys nothing anyone can see.
  -->
  <g transform="translate(16 16) scale(1.14) translate(-16 -16)">
    <path fill="url(#gilt)"
          d="M16 6.6a4.6 4.6 0 0 1 2.62 8.38l2.05 8.63a1.2 1.2 0 0 1-1.17 1.49h-7a1.2 1.2 0 0 1-1.17-1.49l2.05-8.63A4.6 4.6 0 0 1 16 6.6Z"/>
  </g>
</svg>
